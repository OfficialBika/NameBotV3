services:
  - type: web
    name: bika-lookup-v3
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: MODE
        value: webhook
      - key: USE_WEBHOOK
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: UNIFIED_ADDING_DB_ENABLED
        value: "true"
      - key: UNIFIED_ADDING_COLLECTION
        value: characters
      - key: LOOKUP_ENGINE_MODE
        value: sqlite
      - key: SQLITE_SYNC_SECONDS
        value: "10"
      - key: SQLITE_BUILD_ON_START
        value: "true"
      - key: SQLITE_BATCH_SIZE
        value: "100"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: RESULT_CACHE_MAX_ITEMS
        value: "5000"
      - key: RESULT_CACHE_TTL_SECONDS
        value: "900"
      - key: MISS_CACHE_TTL_SECONDS
        value: "60"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_CONCURRENT_LOOKUPS
        value: "6"
      - key: ENABLE_HASH_FALLBACK
        value: "true"
